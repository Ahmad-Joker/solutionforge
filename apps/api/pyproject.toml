[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "solutionforge"
version = "0.1.0"
description = "Multi-tenant platform for reliable, evaluated, permission-controlled AI workflows."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/solutionforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "security: security regression tests (must never be skipped in CI)",
]
filterwarnings = ["error::sqlalchemy.exc.SAWarning", "error::sqlalchemy.exc.SADeprecationWarning"]

[tool.coverage.run]
source = ["solutionforge"]
branch = true
concurrency = ["greenlet", "thread"]  # SQLAlchemy asyncio runs ORM code in greenlets

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]  # assert is fine in tests; production code does not rely on it

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S105", "S106",  # test fixtures contain literal test passwords
    "PT018",         # compound asserts are clearer for paired status/body checks
]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["solutionforge"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
