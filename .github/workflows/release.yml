name: Release

# build → test → image smoke (eval) → publish → staging → smoke → production → smoke → rollback
#
# Triggered by a version tag (v1.2.3) or manually. Deployment stages run only when the
# repository variable DEPLOY_ENABLED is "true" (set once a cloud target exists, Phase 15);
# until then a release stops after publishing digest-pinned images.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false   # never interrupt a deployment half-way

permissions:
  contents: read

jobs:
  ci:
    name: Full CI
    uses: ./.github/workflows/ci.yml

  image-smoke:
    name: Container smoke test
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack from freshly built images
        run: |
          cp .env.example .env
          docker compose up -d --build --wait api worker web
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - name: Smoke test (API, DB, worker, tools, LLM metering, isolation)
        run: python apps/api/scripts/smoke.py http://localhost:8000 --dev --timeout 90
      - name: Web serves the login page
        run: curl -fsS http://localhost:3000/login -o /dev/null
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose.log }
      - if: always()
        run: docker compose down -v

  publish:
    name: Publish images
    needs: image-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api: ${{ steps.api.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
          cache-from: type=gha
      - id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
          cache-from: type=gha

  staging:
    name: Deploy to staging
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: { name: staging, url: "${{ vars.STAGING_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy (images pinned by digest; migrations run before traffic shifts)
        run: infra/deploy/deploy.sh staging "${{ needs.publish.outputs.api }}" "${{ needs.publish.outputs.web }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - name: Smoke test staging
        run: python apps/api/scripts/smoke.py "${{ vars.STAGING_URL }}" --metrics-token "${{ secrets.METRICS_TOKEN }}"

  production:
    name: Deploy to production
    needs: [publish, staging]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Required reviewers are configured on this GitHub environment: a human approves promotion.
    environment: { name: production, url: "${{ vars.PRODUCTION_URL }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: infra/deploy/deploy.sh production "${{ needs.publish.outputs.api }}" "${{ needs.publish.outputs.web }}"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install httpx
      - id: smoke
        name: Smoke test production
        run: python apps/api/scripts/smoke.py "${{ vars.PRODUCTION_URL }}" --metrics-token "${{ secrets.METRICS_TOKEN }}"
      - name: Roll back to the previous release
        if: failure()
        run: infra/deploy/deploy.sh production --rollback
