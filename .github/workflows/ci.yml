name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sf
          POSTGRES_DB: sf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sf" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SF_TEST_DATABASE_URL: postgresql+asyncpg://sf:sf@localhost:5432/sf_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]" pip-audit
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
      - name: Tests (PostgreSQL) with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Security regression suite must not skip
        run: |
          pytest -m security -q -rs | tee security.log
          if grep -q SKIPPED security.log; then echo "security tests were skipped" && exit 1; fi
      - name: Migrations are reversible
        env:
          SF_DATABASE_URL: ${{ env.SF_TEST_DATABASE_URL }}
        run: alembic downgrade base && alembic upgrade head
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage.xml

  backend-sqlite:
    name: Backend tests (SQLite, fast path parity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: solutionforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
