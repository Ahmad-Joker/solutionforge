# Prometheus scrape config for the docker compose "observability" profile.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # Outside dev/test the API requires SF_METRICS_TOKEN; mount it and uncomment:
    # authorization: { type: Bearer, credentials_file: /run/secrets/sf_metrics_token }
    static_configs: [{ targets: ["api:8000"] }]

  - job_name: worker
    # One target per worker replica (compose DNS returns every container's address).
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
