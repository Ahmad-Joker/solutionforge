# Render Blueprint: SolutionForge on Render's free plan, $0/month.
#   solutionforge-api  API with the worker loops embedded (Docker)
#   solutionforge-web  Next.js dashboard + cookie BFF (Docker)
# Database: Supabase free (Session pooler) or Neon free — both PostgreSQL + pgvector.
# Step-by-step: docs/DEPLOY_FREE.md
services:
  - type: web
    name: solutionforge-api
    runtime: docker
    plan: free
    region: virginia   # next to the database: create it in AWS us-east-1 (N. Virginia)
    dockerfilePath: ./infra/docker/api.Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SF_ENVIRONMENT
        value: production
      # Connection string WITHOUT the password, e.g.
      #   postgresql://neondb_owner@ep-xxx.us-east-1.aws.neon.tech/neondb?sslmode=require
      # (Neon: direct, pooling off; Supabase: Session pooler). A full string with the password
      # also works, in which case leave SF_DATABASE_PASSWORD empty.
      - key: SF_DATABASE_URL
        sync: false
      # Just the database password, pasted on its own (Neon's copy button copies exactly this).
      - key: SF_DATABASE_PASSWORD
        sync: false
      - key: SF_JWT_SECRET
        generateValue: true
      # Fernet key generated locally (see docs/DEPLOY_FREE.md), pasted in the dashboard.
      - key: SF_CREDENTIALS_KEYS
        sync: false
      # One free instance: run the worker loops in-process and migrate on start.
      - key: SF_EMBEDDED_WORKER
        value: "true"
      # Free instances get a fraction of a CPU: more processes would only add memory.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SF_MIGRATE_ON_START
        value: "true"
      - key: SF_WORKER_CONCURRENCY
        value: "2"
      - key: SF_WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      # Small pool: free Postgres tiers have low connection limits.
      - key: SF_DATABASE_POOL_SIZE
        value: "5"
      - key: SF_DATABASE_MAX_OVERFLOW
        value: "5"
      # Deterministic mock model: no API key, no spend.
      - key: SF_LLM_ENABLE_MOCK
        value: "true"
      # Only Render's proxy can reach the container, so trust its forwarded headers.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: SF_LOG_JSON
        value: "true"

  - type: web
    name: solutionforge-web
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./infra/docker/web.Dockerfile
    dockerContext: .
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # The API's public URL (https://solutionforge-api-xxxx.onrender.com), pasted after the
      # API's first deploy. Server-side only: browsers talk to this web service, never the API.
      - key: SF_API_URL
        sync: false
