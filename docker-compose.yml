# Local full stack: PostgreSQL (with pgvector) + Redis + migrations + API + workers + web.
#   cp .env.example .env && docker compose up --build
# With metrics, dashboards and traces (Prometheus :9090, Grafana :3001, Jaeger :16686):
#   SF_OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318 docker compose --profile observability up --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: solutionforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solutionforge}
      POSTGRES_DB: solutionforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solutionforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local only: generate shared dev secrets once (see infra/docker/sf-env.sh). Values set in
  # .env always win; this volume is never part of a real deployment.
  dev-secrets:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    user: root
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, secrets
        from cryptography.fernet import Fernet
        path = "/run/sf-dev/secrets.env"
        if not os.path.exists(path):
            lines = [
                "SF_JWT_SECRET=" + secrets.token_urlsafe(48),
                "SF_CREDENTIALS_KEYS=" + Fernet.generate_key().decode(),
            ]
            with open(path, "w") as f:
                f.write(chr(10).join(lines) + chr(10))
            os.chmod(path, 0o644)
    volumes: [sfdev:/run/sf-dev]

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    volumes: [sfdev:/run/sf-dev:ro]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
    depends_on:
      postgres: { condition: service_healthy }
      dev-secrets: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: [.env]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
      SF_REDIS_URL: redis://redis:6379/0
      # Trust X-Forwarded-For from the web BFF (per-IP rate limits behind the proxy).
      FORWARDED_ALLOW_IPS: "*"
      SF_OTEL_EXPORTER_OTLP_ENDPOINT: ${SF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # 4 processes × (5 + 5) = 40 connections; workers 2 × 10 = 20; Postgres allows 100.
      WEB_CONCURRENCY: "4"
      SF_DATABASE_POOL_SIZE: "5"
      SF_DATABASE_MAX_OVERFLOW: "5"
    volumes: [sfdev:/run/sf-dev:ro]
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "solutionforge.worker"]
    env_file: [.env]
    volumes: [sfdev:/run/sf-dev:ro]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
      SF_WORKER_METRICS_PORT: "9100"   # private network only; not published
      SF_DATABASE_POOL_SIZE: "5"
      SF_DATABASE_MAX_OVERFLOW: "5"
      SF_OTEL_EXPORTER_OTLP_ENDPOINT: ${SF_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2   # safe: leases + fenced writes; demonstrates horizontal scaling
    healthcheck:
      disable: true   # the image HEALTHCHECK probes the API port, which workers don't serve

  web:
    build: { context: ., dockerfile: infra/docker/web.Dockerfile }
    environment:
      SF_API_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

  # ---------------------------------------------------------------- observability profile
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    volumes:
      - ./infra/obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/obs/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/obs/grafana/datasources.yml:/etc/grafana/provisioning/datasources/sf.yml:ro
      - ./infra/obs/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/sf.yml:ro
      - ./infra/obs/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.64.0   # accepts OTLP/HTTP on 4318
    profiles: [observability]
    ports: ["127.0.0.1:16686:16686"]

volumes:
  pgdata:
  sfdev:
