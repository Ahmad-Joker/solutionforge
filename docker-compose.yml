# Local full stack: PostgreSQL (with pgvector) + Redis + migrations + API.
#   cp .env.example .env && docker compose up --build
# Observability services (OTel collector, Prometheus, Grafana) are added in Phase 12.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: solutionforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-solutionforge}
      POSTGRES_DB: solutionforge
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solutionforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["alembic", "upgrade", "head"]
    env_file: [.env]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: [.env]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
      SF_REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    command: ["python", "-m", "solutionforge.worker"]
    env_file: [.env]
    environment:
      SF_DATABASE_URL: postgresql+asyncpg://solutionforge:${POSTGRES_PASSWORD:-solutionforge}@postgres:5432/solutionforge
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: 2   # safe: leases + fenced writes; demonstrates horizontal scaling
    healthcheck:
      disable: true   # the image HEALTHCHECK probes the API port, which workers don't serve

volumes:
  pgdata:
